# pyproject.toml — project manifest (PEP 621)
# This file declares the project metadata, dependencies, and tooling
# configuration. It replaces the older setup.py / setup.cfg / requirements.txt
# combination.

[build-system]
# `requires` lists the build-time dependencies (only used to package the
# project, not to run it). `build-backend` tells pip which tool to invoke to
# build the project. Hatchling is the modern PyPA-recommended choice.
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
# The distribution name on PyPI (use dashes for the package distribution name).
# The Python import name uses underscores: `import vod_analyzer`.
name = "vod-analyzer"

# The version is declared dynamically — `tool.hatch.version` below tells
# hatchling to read it from src/vod_analyzer/__init__.py. Single source of
# truth: we only update __version__ in one place when bumping releases.
dynamic = ["version"]

description = "Analyze stream VODs and extract the best moments as horizontal and vertical clips."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Quentin Hamonic" },
]

keywords = [
    "video",
    "vod",
    "stream",
    "highlights",
    "ffmpeg",
    "twitch",
    "youtube",
]

classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Typing :: Typed",
]

# Runtime dependencies — we add them phase by phase as they become needed.
dependencies = [
    "typer>=0.12",
    "librosa>=0.10",
]

[project.scripts]
vod-analyzer = "vod_analyzer.cli.main:app"

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
# Optional dependency groups let users install only what they need.
# `dev` is for contributors; runtime users don't need pytest, ruff, etc.
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.urls]
# These URLs will be added when the GitHub repo exists (after Phase 0).
# Homepage = "https://github.com/<user>/vod-analyzer"
# Repository = "https://github.com/<user>/vod-analyzer"
# Issues = "https://github.com/<user>/vod-analyzer/issues"

# ---------------------------------------------------------------------------
# Hatchling configuration
# ---------------------------------------------------------------------------

[tool.hatch.version]
# Single source of truth for the version string.
path = "src/vod_analyzer/__init__.py"

[tool.hatch.build.targets.wheel]
# Tells hatchling where to find the package source when building a wheel.
# We use the modern src/ layout, so the package lives at src/vod_analyzer/.
packages = ["src/vod_analyzer"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "dist", "docs/_build"]

[tool.ruff.lint]
# A pragmatic-but-strict baseline. We can broaden this set later as the
# codebase matures. Each prefix is a category of rules; `ruff linter --help`
# documents them all.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports/variables, undefined names, ...)
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "N",    # pep8-naming (consistent class / function / variable naming)
    "UP",   # pyupgrade (use modern Python syntax)
    "B",    # flake8-bugbear (likely bugs and design issues)
    "C4",   # flake8-comprehensions (idiomatic comprehensions)
    "SIM",  # flake8-simplify (suggest simpler equivalent code)
    "A",    # flake8-builtins (don't shadow builtin names)
    "RET",  # flake8-return (return statement consistency)
    "PTH",  # flake8-use-pathlib (prefer pathlib over os.path)
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed a bit of slack.
"tests/**/*.py" = [
    "S101",  # assert usage is fine in tests
]

[tool.ruff.format]
# Ruff's formatter is Black-compatible by design. These defaults match Black,
# but we list them explicitly so any future tweak is obvious.
quote-style = "double"
indent-style = "space"
docstring-code-format = true       # also format Python code blocks inside docstrings
docstring-code-line-length = 88

# ---------------------------------------------------------------------------
# Mypy (static type checker)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/vod_analyzer", "tests"]
show_error_codes = true
pretty = true

# Tests: pytest decorators sometimes lack stubs.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# CLI: Typer's @app.command() decorator is not fully typed upstream.
[[tool.mypy.overrides]]
module = "vod_analyzer.cli.*"
disallow_untyped_decorators = false

# Third-party libraries without bundled type stubs.
[[tool.mypy.overrides]]
module = ["librosa.*", "numpy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",                # short summary for all non-passed outcomes
    "--strict-markers",   # error on undefined pytest markers
    "--strict-config",    # error on unknown ini config options
    "--showlocals",       # show local variables in tracebacks
]
